# XcodeGen project — generates Unwhoop.xcodeproj via `xcodegen generate`.
# Follows the same pattern as Noop's own project.yml.
name: Unwhoop

options:
  bundleIdPrefix: com.unwhoop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic

# Vendored Noop protocol layer (PolyForm Noncommercial 1.0.0 — see
# Vendor/Noop/LICENSE). Pure Swift + Foundation, no external dependencies.
# Built as a real Swift package (not raw sources) because WhoopProtocol
# loads whoop_protocol.json via Bundle.module.
packages:
  WhoopProtocol:
    path: Vendor/Noop/Packages/WhoopProtocol

targets:
  Unwhoop:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Unwhoop
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: WhoopProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unwhoop.app
        # Use the checked-in plist. info.path generates a NEW plist and
        # overwrites this file, dropping every key absent from properties.
        INFOPLIST_FILE: Unwhoop/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    # No external dependencies in v1: SwiftData, Swift Charts, CoreBluetooth
    # and HealthKit are all SDK frameworks. The Noop protocol package is
    # vendored at Vendor/Noop/Packages/WhoopProtocol (PolyForm Noncommercial
    # 1.0.0, pinned e580175) and linked via `packages:` above. The BLE
    # orchestration lives in our own NoopBandSyncAdapter (Unwhoop/BLE/),
    # written directly against WhoopProtocol's API — Noop's Strand/BLE app
    # layer was deliberately NOT vendored (it drags in WhoopStore,
    # StrandAnalytics and app UI).
