# XcodeGen project — generates Unwhoop.xcodeproj via `xcodegen generate`.
# Follows the same pattern as Noop's own project.yml.
name: Unwhoop

options:
  bundleIdPrefix: com.unwhoop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic

# Vendored Noop protocol layer (PolyForm Noncommercial 1.0.0 — see
# Vendor/Noop/LICENSE). Pure Swift + Foundation, no external dependencies.
# Built as a real Swift package (not raw sources) because WhoopProtocol
# loads whoop_protocol.json via Bundle.module.
packages:
  WhoopProtocol:
    path: Vendor/Noop/Packages/WhoopProtocol

targets:
  Unwhoop:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Unwhoop
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - package: WhoopProtocol
    info:
      path: Unwhoop/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unwhoop.app
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Belt-and-suspenders: inject the privacy usage descriptions via build
        # settings too, so they are guaranteed present in the built Info.plist
        # even if the info.path wiring above ever breaks. (2026-10-12: a
        # sideloaded build crashed on launch with the CBCentralManager
        # "missing NSBluetoothAlwaysUsageDescription" assertion — the key
        # exists in Unwhoop/Resources/Info.plist but was absent from the
        # installed app.)
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Unwhoop uses Bluetooth to connect to your WHOOP 5.0 band and sync your sensor data (heart rate, motion, skin temperature). All processing happens on this phone — nothing is uploaded anywhere."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Unwhoop can write your heart rate, respiratory rate, and sleep to Apple Health when you turn on the HealthKit toggle in the Data tab. It never reads your health data."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    # No external dependencies in v1: SwiftData, Swift Charts, CoreBluetooth
    # and HealthKit are all SDK frameworks. The Noop protocol package is
    # vendored at Vendor/Noop/Packages/WhoopProtocol (PolyForm Noncommercial
    # 1.0.0, pinned e580175) and linked via `packages:` above. The BLE
    # orchestration lives in our own NoopBandSyncAdapter (Unwhoop/BLE/),
    # written directly against WhoopProtocol's API — Noop's Strand/BLE app
    # layer was deliberately NOT vendored (it drags in WhoopStore,
    # StrandAnalytics and app UI).
