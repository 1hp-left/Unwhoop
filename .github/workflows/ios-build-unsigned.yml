name: Build unsigned .ipa (free, no Apple Developer account)

# The $0 path: builds the app on GitHub's free macOS runners WITHOUT any
# signing. You install the resulting .ipa with SideStore or AltStore, which
# signs it on your iPhone with your FREE Apple ID (7-day certs, auto-refreshed
# over WiFi — that's their whole trick). Public repo = unlimited free builds.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test metadata validation
        run: python3 scripts/test_validate_app_plist.py

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          git diff --exit-code -- Unwhoop/Resources/Info.plist

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project Unwhoop.xcodeproj -scheme Unwhoop

      - name: Build for device (unsigned)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project Unwhoop.xcodeproj \
            -scheme Unwhoop \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Test pairing lifecycle on simulator
        timeout-minutes: 15
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))')
          xcodebuild test \
            -project Unwhoop.xcodeproj -scheme Unwhoop -configuration Release \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/simulator-tests" \
            -resultBundlePath "$RUNNER_TEMP/sync-tests.xcresult" \
            -parallel-testing-enabled NO \
            ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=NO

      - name: Export UI screenshots
        run: |
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/sync-tests.xcresult" \
            --output-path "$RUNNER_TEMP/ui-screenshots"

      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Unwhoop-ui-screenshots
          path: ${{ runner.temp }}/ui-screenshots

      - name: Validate built app metadata
        run: |
          python3 scripts/validate_app_plist.py \
            "$RUNNER_TEMP/derived/Build/Products/Release-iphoneos/Unwhoop.app" \
            --version 1.1.1 --build 7

      - name: Package .ipa
        run: |
          set -euo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/derived/Build/Products/Release-iphoneos" \
            -maxdepth 1 -name "*.app" | head -1)
          echo "Packaging: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr Unwhoop-unsigned.ipa Payload

      - name: Validate packaged IPA metadata
        run: |
          python3 scripts/validate_app_plist.py "$RUNNER_TEMP/Unwhoop-unsigned.ipa" \
            --version 1.1.1 --build 7

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: Unwhoop-unsigned-ipa
          path: ${{ runner.temp }}/Unwhoop-unsigned.ipa
          retention-days: 14
